# huvu on its host: huvu and Hermes in one container.
#
#   docker compose up -d
#
# It listens on the host only (127.0.0.1), on HUVU_PORT, 27613 by default,
# picked at random so it collides with nothing. The host's own cloudflared
# publishes it at https://huvu.hrishik.me, which serves the web client and
# the backend both. That cloudflared runs in a container of its own (the
# immich project's), so the tunnel's service is
# http://host.docker.internal:27613: localhost there is cloudflared's own
# container.
#
# Next to this file, a .env with:
#   GROQ_API_KEY=gsk_...        speech to text; optional
#   CLOUDFLARE_ACCOUNT_ID=...   the router's Clef-flash, for asks that aren't
#   CLOUDFLARE_AI_TOKEN=...     house commands; optional, without them those run on pro
#   HUVU_PORT=27613             only to move the port
#
# First start, Hermes's login and adding people: hrishik.md.
services:
  huvu:
    image: ghcr.io/fringewidth/huvu:latest
    build: .
    restart: unless-stopped
    environment:
      - HUVU_PUBLIC_URL=${HUVU_PUBLIC_URL:-https://huvu.hrishik.me}
      # The Alexa skill that asks for the Fire TV (backend/src/huvu/alexa.py).
      # Not a secret: Amazon signs every request, and this only names the skill.
      - HUVU_ALEXA_SKILL_ID=${HUVU_ALEXA_SKILL_ID:-amzn1.ask.skill.49627247-f5d1-4980-997f-5a8a9039ebe5}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_AI_TOKEN=${CLOUDFLARE_AI_TOKEN:-}
    volumes:
      - huvu:/opt/data
    ports:
      - "127.0.0.1:${HUVU_PORT:-27613}:3001"

volumes:
  huvu:
