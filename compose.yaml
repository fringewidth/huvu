# huvu on its host: huvu and Hermes in one container.
#
#   docker compose up -d
#
# It listens on the host only (127.0.0.1), on HUVU_PORT, 27613 by default,
# picked at random so it collides with nothing. A tunnel on the host
# publishes it at HUVU_PUBLIC_URL, which serves the web client and the
# backend both. When cloudflared runs in a container of its own, the
# tunnel's service is http://host.docker.internal:27613: localhost there
# is cloudflared's own container.
#
# Next to this file, a .env (gitignored, so the address stays out of the
# repo) with:
#   HUVU_PUBLIC_URL=https://...  the address phones reach huvu at; required
#   GROQ_API_KEY=gsk_...        speech to text; optional
#   YOUTUBE_API_KEY=...         finding YouTube videos to hand off to the app; optional
#   CLOUDFLARE_ACCOUNT_ID=...   the router's Clef-flash, for asks that aren't
#   CLOUDFLARE_AI_TOKEN=...     house commands; optional, without them those run on pro
#   HUVU_PORT=27613             only to move the port
#
# First start, Hermes's login and adding people: hrishik.md.
services:
  huvu:
    image: ghcr.io/fringewidth/huvu:latest
    build:
      context: .
      # The phone's live update bundle carries the address (Dockerfile).
      args:
        HUVU_PUBLIC_URL: ${HUVU_PUBLIC_URL:?set HUVU_PUBLIC_URL in .env, the address phones reach huvu at}
    restart: unless-stopped
    environment:
      - HUVU_PUBLIC_URL=${HUVU_PUBLIC_URL:?set HUVU_PUBLIC_URL in .env, the address phones reach huvu at}
      # The Alexa skill that asks for the Fire TV (backend/src/huvu/alexa.py).
      # Not a secret: Amazon signs every request, and this only names the skill.
      - HUVU_ALEXA_SKILL_ID=${HUVU_ALEXA_SKILL_ID:-amzn1.ask.skill.49627247-f5d1-4980-997f-5a8a9039ebe5}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_AI_TOKEN=${CLOUDFLARE_AI_TOKEN:-}
      # Hermes's dashboard, only for the browser's screen: the backend asks it
      # for a view and relays it to the app. Bound inside the container only,
      # so its session token works; 50-huvu makes that token.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=127.0.0.1
    volumes:
      - huvu:/opt/data
    ports:
      - "127.0.0.1:${HUVU_PORT:-27613}:3001"

volumes:
  huvu:
