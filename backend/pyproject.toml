[project]
name = "huvu"
version = "0.0.0"
description = "huvu's backend: sources and their tables, triggers, the action policy, and the link to Hermes and the frontend."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "mcp",
    "pyjwt[crypto]>=2.15.1",
    "segno>=1.6.6",
    "websockets>=17.1",
    "edge-tts>=7.3.1",
    "apsw>=3.53.4.0",
    "tzdata>=2026.5",
    "cryptography>=50.0.2",
    "certifi>=2026.7.22",
    "http-ece>=1.2.1",
    "dkimpy>=1.1.8",
    "dnspython>=2.9.0",
    "pypdf>=6.20.1",
]

[project.scripts]
huvu = "huvu.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huvu", "src/huvu_drivers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
