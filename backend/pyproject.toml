[project]
name = "huvu"
version = "0.0.0"
description = "huvu's backend: sources, state, the event log, triggers, the action policy, and the link to Hermes and the frontend."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "mcp",
]

[project.scripts]
huvu = "huvu.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huvu", "src/huvu_drivers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
