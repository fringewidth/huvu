# Builds the host's image (Dockerfile) on every push to main and publishes
# it as the repo's package, ghcr.io/fringewidth/huvu, tagged latest and with
# the commit. amd64 only, since the host is the Windows laptop. The laptop
# still builds its own copy; this one is the record of each version.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fringewidth/huvu:latest
            ghcr.io/fringewidth/huvu:${{ github.sha }}
          # Links the package to the repo, so it shares the repo's access.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
