<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>huvu</title>
    <style>
      /* huvu's night-garden colors (frontend/src/config/palette.ts). */
      :root {
        --paper: rgb(13, 14, 23);
        --ivory: rgb(239, 231, 216);
        --dim: rgba(239, 231, 216, 0.55);
        --line: rgba(239, 231, 216, 0.18);
        --sindoor: rgb(224, 113, 90);
        --marigold: rgb(233, 162, 59);
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ivory);
        font: 15px/1.55 system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      h1 {
        margin: 0 0 4px;
        font: italic 34px Georgia, serif;
      }
      p {
        margin: 0 0 20px;
        color: var(--dim);
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ivory);
        font: 14px ui-monospace, monospace;
      }
      textarea {
        min-height: 140px;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      button {
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ivory);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--marigold);
        color: var(--marigold);
      }
      #status {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        white-space: pre-line;
      }
      #status .error {
        color: var(--sindoor);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>huvu</h1>
      <p>
        Sends the pages you open in this Chrome to your huvu, for your agent alone. Incognito windows never reach it. Addresses lose their query
        strings, except a YouTube video's id and the words of a search.
      </p>

      <label for="address">Address</label>
      <input id="address" type="url" placeholder="https://huvu.hrishik.me" />

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="from: uv run huvu tracker add &lt;you&gt; --browser" autocomplete="off" />

      <label for="blocked">Sites to keep out, one per line</label>
      <textarea id="blocked" spellcheck="false"></textarea>

      <div class="row">
        <button id="save" class="primary" type="button">Save</button>
        <button id="now" type="button">Send now</button>
      </div>

      <div id="status"></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
