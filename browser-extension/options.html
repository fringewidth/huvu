<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>huvu</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ivory);
        font: 14px ui-monospace, monospace;
      }
      textarea {
        min-height: 140px;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      #status {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>huvu</h1>
      <p>
        Sends the titles of the pages you open in this Chrome to your huvu, for your agent alone. No address leaves the browser, nothing from
        before you set it up is sent, and incognito windows never reach it.
      </p>

      <label for="address">Address</label>
      <input id="address" type="url" placeholder="https://huvu.hrishik.me" />

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="from: uv run huvu tracker add &lt;you&gt; --browser" autocomplete="off" />

      <label for="blocked">Sites to keep out, one per line</label>
      <textarea id="blocked" spellcheck="false"></textarea>

      <div class="row">
        <button id="save" class="primary" type="button">Save</button>
        <button id="now" type="button">Send now</button>
      </div>

      <div id="status"></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
