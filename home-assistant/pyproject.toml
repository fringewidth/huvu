[project]
name = "huvu-home-assistant"
version = "0.0.0"
description = "huvu's Home Assistant custom components, and their tests."
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.7.2",
    "pytest-homeassistant-custom-component==0.13.346",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
